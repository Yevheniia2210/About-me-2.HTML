<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video and Photo - Yevheniia Danilova</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      color: #f0f0f0;
      overflow-x: hidden;
    }

    .stars-container {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: -2;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      animation: twinkle 2s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    .crescent {
      position: fixed;
      top: 50px;
      right: 70px;
      width: 100px;
      height: 100px;
      background: #f5f3ce;
      border-radius: 50%;
      box-shadow: 0 0 25px 5px #fff9b1;
      z-index: -1;
      overflow: hidden;
    }

    .crescent::before {
      content: "";
      position: absolute;
      top: 0;
      left: 25px;
      width: 100px;
      height: 100px;
      background: #090a0f;
      border-radius: 50%;
    }

    .container {
      width: 700px;
      margin: 120px auto 40px 60px;
      margin-right: 180px; /* защита от луны */
      padding: 25px;
      background-color: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
    }

    h1 {
      font-size: 2em;
      color: #fffbe6;
      margin-bottom: 25px;
      text-shadow: 1px 1px 5px #ccc;
      text-align: left;
    }

    video {
      width: 640px;
      height: 480px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    .btn {
      display: inline-block;
      background-color: #1a73e8;
      color: white;
      padding: 10px 22px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: transform 0.3s, background-color 0.3s, box-shadow 0.3s;
      box-shadow: 0 0 10px rgba(26, 115, 232, 0.6);
    }

    .btn:hover {
      background-color: #0c47a1;
      transform: scale(1.08);
      box-shadow: 0 0 20px rgba(26, 115, 232, 0.8);
    }
  </style>
</head>
<body>

  <!-- Звезды -->
  <div class="stars-container" id="stars"></div>

  <!-- Растущий месяц -->
  <div class="crescent"></div>

  <div class="container">
    <h1>Video and Photo</h1>

    <video width="640" height="480" controls>
      <source src="Video.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <a href="index.html" class="btn">⬅ Back to About Me</a>
  </div>

  <!-- Генерация звёзд -->
  <script>
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 100; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      star.style.top = `${Math.random() * 100}%`;
      star.style.left = `${Math.random() * 100}%`;
      star.style.animationDuration = `${2 + Math.random() * 3}s`;
      starsContainer.appendChild(star);
    }
  </script>

</body>
</html>
